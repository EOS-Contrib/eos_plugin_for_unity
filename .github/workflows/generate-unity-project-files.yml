name: Generate Unity Solution

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-solution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library Folder
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        
      - name: List Generated Files (Debugging)
        run: ls -la

      
      - name: Generate Solution Files
        run: |
          unity-editor -batchmode -quit -nographics -logFile -executeMethod UnityEditor.SyncVS.SyncSolution

      - name: Upload Solution Files
        uses: actions/upload-artifact@v4
        with:
          name: UnitySolution
          path: "*.sln"
